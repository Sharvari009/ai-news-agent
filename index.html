<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Business Brief</title>
<meta name="description" content="Daily AI business news for India and the world, picked by an AI agent, with links to every original article.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAEEF3; --panel: #FFFFFF; --ink: #1B2A41; --muted: #56667C;
    --line: #D3DAE3; --accent: #3050A8;
    --funding: #2F6B4F; --launch: #3050A8; --bigtech: #6B3F8C; --india: #B5650D; --policy: #6E6420;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121A26; --panel: #1B2636; --ink: #E6ECF3; --muted: #9AA8BA;
      --line: #2B3A4F; --accent: #8FA8F0;
      --funding: #6FC19A; --launch: #8FA8F0; --bigtech: #C39BE0; --india: #F0A95C; --policy: #CFC46E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121A26; --panel: #1B2636; --ink: #E6ECF3; --muted: #9AA8BA;
    --line: #2B3A4F; --accent: #8FA8F0;
    --funding: #6FC19A; --launch: #8FA8F0; --bigtech: #C39BE0; --india: #F0A95C; --policy: #CFC46E;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Figtree, system-ui, sans-serif; }
  .app { min-height: 100vh; display: grid; grid-template-columns: 200px 1fr; }
  .side { padding: 28px 16px; border-right: 1px solid var(--line); }
  .side h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; margin: 0 0 12px 8px; }
  .day { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px;
         border-radius: 6px; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; }
  .day[aria-current="true"] { background: var(--ink); color: var(--bg); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { padding: 32px clamp(16px, 4vw, 48px); max-width: 780px; }
  .brand { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700;
       font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 0; }
  .sub { color: var(--muted); margin: 8px 0 0; font-size: 15px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px;
          font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .story { background: var(--panel); border-left: 4px solid var(--muted); padding: 18px 20px;
           margin-top: 14px; border-radius: 0 8px 8px 0; }
  .cat { font-size: 13px; font-weight: 600; }
  .story h3 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: 20px;
              line-height: 1.25; margin: 6px 0 8px; }
  .story p { margin: 0 0 8px; line-height: 1.55; font-size: 15px; max-width: 68ch; }
  .why { color: var(--muted); }
  .link { color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: none; }
  .link:hover { text-decoration: underline; }
  .note { background: var(--panel); padding: 20px; border-radius: 8px; margin-top: 24px; line-height: 1.55; }
  footer { color: var(--muted); font-size: 13px; margin: 40px 0 16px; line-height: 1.5; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px;
            display: flex; gap: 6px; overflow-x: auto; }
    .side h2 { display: none; }
    .day { width: auto; white-space: nowrap; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Past days">
    <h2>Archive</h2>
    <div id="days"></div>
  </nav>
  <main>
    <p class="brand">AI Business Brief</p>
    <h1 id="date">Loading…</h1>
    <p class="sub" id="sub"></p>
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <div id="stories"></div>
    <footer>Stories are picked and summarised by an AI agent every morning from trusted news sites. Summaries can contain mistakes, so check the original article before quoting it.</footer>
  </main>
</div>

<script>
const COLORS = {
  "Funding": "var(--funding)", "Product launch": "var(--launch)", "Big Tech": "var(--bigtech)",
  "India": "var(--india)", "Policy": "var(--policy)"
};
const $ = (id) => document.getElementById(id);
let dates = [], current = null, filter = "All";

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//.test(u || "") ? u : "#";
const longDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-IN",
  { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const shortDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-IN",
  { weekday: "short", day: "numeric", month: "short" });

async function getJSON(path) {
  const res = await fetch(path + "?v=" + Date.now());
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function renderDays() {
  $("days").innerHTML = dates.map((d, i) =>
    `<button class="day" aria-current="${d === current?.date}" data-date="${d}">${i === 0 ? "Latest" : shortDate(d)}</button>`
  ).join("");
  document.querySelectorAll(".day").forEach((b) => b.onclick = () => openDay(b.dataset.date));
}

function renderStories() {
  const stories = current.stories || [];
  const cats = ["All", ...Object.keys(COLORS).filter((c) => stories.some((s) => s.category === c))];
  $("chips").innerHTML = cats.map((c) =>
    `<button class="chip" aria-pressed="${c === filter}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach((b) => b.onclick = () => { filter = b.dataset.cat; renderStories(); });

  const shown = filter === "All" ? stories : stories.filter((s) => s.category === filter);
  $("stories").innerHTML = shown.map((s) => `
    <article class="story" style="border-color:${COLORS[s.category] || "var(--muted)"}">
      <span class="cat" style="color:${COLORS[s.category] || "var(--muted)"}">${esc(s.category)}</span>
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.summary)}</p>
      ${s.why ? `<p class="why"><strong>Why it matters:</strong> ${esc(s.why)}</p>` : ""}
      <a class="link" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">Read the full story on ${esc(s.source || "the source")}</a>
    </article>`).join("");
}

async function openDay(date) {
  try {
    current = await getJSON(`news/${date}.json`);
    filter = "All";
    $("date").textContent = longDate(current.date);
    $("sub").textContent = `${current.stories.length} stories, chosen from ${current.articles_read} articles across ${current.sources_read} news sites`;
    renderDays();
    renderStories();
  } catch {
    $("stories").innerHTML = `<div class="note">This day's brief couldn't be loaded. Pick another day from the archive.</div>`;
  }
}

(async () => {
  try {
    dates = await getJSON("news/index.json");
  } catch { dates = []; }
  if (!dates.length) {
    $("date").textContent = "No brief yet";
    $("stories").innerHTML = `<div class="note">The first brief appears after the agent runs. On GitHub, open the <strong>Actions</strong> tab, choose <strong>Daily AI news brief</strong>, and select <strong>Run workflow</strong>. Refresh this page about two minutes later.</div>`;
    return;
  }
  openDay(dates[0]);
})();
</script>
</body>
</html>
